[pytest]
testpaths = test
python_files = test_*.py

# The global conda env has a broken deepeval/langchain plugin that raises
# ModuleNotFoundError during pytest's plugin autoload, which kills collection
# before a single test of ours runs. Nothing in this project uses those
# packages, so the fix is to not load third-party plugins at all.
#
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest
#
# That env var cannot be set from this file (autoload happens before ini
# parsing), so it is documented here and in README/Makefile rather than
# silently required. -p no:cacheprovider keeps .pytest_cache out of the tree.
addopts = -p no:cacheprovider
